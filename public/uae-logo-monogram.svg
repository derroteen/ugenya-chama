<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <circle id="ring" cx="100" cy="100" r="92"/>
  </defs>

  <!-- Outer navy circle -->
  <circle cx="100" cy="100" r="96" fill="#0f1729"/>

  <!-- Gold ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#c9a227" stroke-width="2.5"/>

  <!-- 12-node branch arc, echoing the homepage hero's network motif -->
  <g fill="#c9a227" opacity="0.85">
    <!-- nodes arranged along a lower arc, representing the 12 branches -->
    <circle cx="35" cy="150" r="2.6"/>
    <circle cx="46" cy="162" r="2.6"/>
    <circle cx="60" cy="171" r="2.6"/>
    <circle cx="76" cy="177" r="2.6"/>
    <circle cx="93" cy="180" r="2.6"/>
    <circle cx="110" cy="179" r="2.6"/>
    <circle cx="126" cy="175" r="2.6"/>
    <circle cx="141" cy="168" r="2.6"/>
    <circle cx="154" cy="158" r="2.6"/>
    <circle cx="164" cy="146" r="2.6"/>
    <circle cx="171" cy="132" r="2.6"/>
    <circle cx="175" cy="117" r="2.6"/>
  </g>
  <path d="M35,150 46,162 60,171 76,177 93,180 110,179 126,175 141,168 154,158 164,146 171,132 175,117"
        fill="none" stroke="#c9a227" stroke-width="1" opacity="0.35"/>

  <!-- UAE monogram -->
  <text x="100" y="103" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="62" fill="#ffffff" letter-spacing="1">UAE</text>

  <!-- thin gold underline beneath the letters -->
  <rect x="62" y="118" width="76" height="3" fill="#c9a227"/>
</svg>
